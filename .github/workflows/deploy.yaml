name: Deploy Laravel ke Server (Fresh DB)

on:
  push:
    branches:
      - Zwar  # branch utama

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: Zwar

    steps:
    # Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Setup SSH connection
    - name: Setup SSH connection
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    # Deploy via SSH
    - name: Deploy to server via SSH
      run: |
        ssh -p 21032 -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
          set -e
          cd web

          # Sinkron semua file dengan GitHub (token auth, tidak tergantung SSH key server)
          git remote set-url origin https://x-access-token:${{ secrets.DEPLOY_GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch --prune origin ${{ env.DEPLOY_BRANCH }}
          git checkout -B ${{ env.DEPLOY_BRANCH }} origin/${{ env.DEPLOY_BRANCH }}
          git reset --hard origin/${{ env.DEPLOY_BRANCH }}
          git clean -fd

          # Install dependencies
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm install
          npm run build

          # Laravel tasks
          php artisan migrate:fresh --seed --force
          php artisan storage:link
          php artisan optimize
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
        "