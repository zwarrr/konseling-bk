name: Deploy Laravel ke Server

on:
  push:
    branches:
      - Zwar

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repo (optional, tapi tetap bagus ada)
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Setup SSH ke server
    - name: Setup SSH connection
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    # 3. Deploy ke server
    - name: Deploy via SSH
      run: |
        ssh -p 21032 -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
          set -e

          cd web

          # Start ssh-agent & load key khusus git (yang dulu working)
          eval \$(ssh-agent -s)
          ssh-add ~/.ssh/zwar

          # Pastikan pakai SSH, bukan HTTPS
          git remote set-url origin git@github.com:${{ github.repository }}.git

          # Pull branch Zwar
          git fetch origin Zwar
          git checkout Zwar || git checkout -b Zwar
          git reset --hard origin/Zwar

          # Install dependencies
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm install
          npm run build

          # Laravel optimization
          php artisan migrate --force
          php artisan optimize
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
        "